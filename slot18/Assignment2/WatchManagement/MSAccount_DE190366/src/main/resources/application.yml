# [TODO-2.2, TODO-3.2: datasource DBAccount + naming strategy, cấu hình JWT]
server:
  port: 8081

spring:
  application:
    name: ms-account
  config:
    # Chạy local: đọc DB_PASSWORD, JWT_SECRET... từ file .env ở thư mục WatchManagement (không commit).
    # Docker truyền biến môi trường trực tiếp nên file này không bắt buộc.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBAccount;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        # Giữ NGUYÊN tên trong @Table/@Column (StoreAccounts, WatchID...) đúng như đề bài.
        # Mặc định Spring Boot đổi thành store_accounts, watch_id...
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    # Hibernate 7 tự nhận dialect SQL Server từ JDBC metadata -> không cần khai báo hibernate.dialect

jwt:
  # Không để giá trị mặc định: secret phải đến từ biến môi trường / .env (không commit).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}            # 15 phút
  refresh-expiration: ${REFRESH_EXPIRATION:604800000}  # 7 ngày

logging:
  level:
    com.mss301.account: INFO
